name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: بک‌اند (build و تست)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ERPDotNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
      - name: بسته آسیب‌پذیر نباشد
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::بسته NuGet آسیب‌پذیر پیدا شد."
            exit 1
          fi

  frontend:
    name: فرانت (type-check، lint، build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: erp-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  api-contract:
    name: هم‌خوانی قرارداد API با تایپ‌های فرانت
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: erp-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: erp-frontend
      - run: npm run api:types
        working-directory: erp-frontend
      - name: سند OpenAPI و تایپ‌های تولیدشده باید commit شده باشند
        run: |
          if ! git diff --exit-code -- erp-frontend/openapi erp-frontend/src/types/api.generated.ts; then
            echo "::error::قرارداد API تغییر کرده است. در erp-frontend دستور npm run api:types را اجرا و نتیجه را commit کنید."
            exit 1
          fi

  e2e:
    name: تست E2E (بک‌اند و دیتابیس واقعی)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: E2e_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'E2e_Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # دیتابیس موقت همین job؛ رمز فقط برای کانتینر یک‌بارمصرف CI است
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=ERP_E2E;User Id=sa;Password=E2e_Passw0rd!;TrustServerCertificate=True;
      ConnectionStrings__Redis: localhost:6379
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: erp-frontend/package-lock.json

      - name: build بک‌اند
        run: dotnet build ERPDotNet/ERPDotNet.API -c Release
      - name: اجرای API (migration و seed کاربر admin در شروع)
        run: |
          nohup dotnet run --no-build -c Release --project ERPDotNet/ERPDotNet.API > api.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5000/api/Auth/login \
              -H 'Content-Type: application/json' -d '{"username":"admin","password":"Admin@1234"}' || true)
            [ "$code" = "200" ] && echo "API آماده است" && exit 0
            sleep 3
          done
          echo "::error::API بالا نیامد"; tail -50 api.log; exit 1

      - run: npm ci --no-audit --no-fund
        working-directory: erp-frontend
      - name: build و اجرای فرانت
        working-directory: erp-frontend
        run: |
          npm run build
          nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/login && echo "فرانت آماده است" && exit 0
            sleep 2
          done
          echo "::error::فرانت بالا نیامد"; tail -50 ../web.log; exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: erp-frontend
      - name: اجرای تست‌ها
        run: npm run e2e
        working-directory: erp-frontend

      - name: گزارش و لاگ‌ها در صورت شکست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            erp-frontend/playwright-report
            erp-frontend/test-results
            api.log
            web.log
          retention-days: 7
